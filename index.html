<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>newsalat</title>
<meta name="theme-color" content="#0f5c3a">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2ef; --card:#ffffff; --ink:#16231c; --muted:#5d6b63;
  --green:#0f5c3a; --green-soft:#d9eadf; --red:#b3261e; --line:#d5ddd8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}

/* top bar */
header{background:var(--green);color:#fff;position:sticky;top:0;z-index:10}
.bar{max-width:640px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.logo span{border-bottom:3px solid var(--red)}
#bell{background:none;border:0;color:#fff;cursor:pointer;padding:6px;border-radius:50%;position:relative}
#bell:focus-visible,.chip:focus-visible,#q:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
#bell svg{display:block}
#bell.on::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;background:#ffd54a;border-radius:50%;border:2px solid var(--green)}

/* bell panel */
#panel{display:none;position:absolute;right:14px;top:56px;width:min(290px,calc(100vw - 28px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#panel.open{display:block}
.row{display:flex;align-items:center;justify-content:space-between;font-weight:600;margin-bottom:10px}
.switch{position:relative;width:46px;height:26px}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:#b9c4bd;border-radius:26px;transition:.15s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+i{background:var(--green)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:3px solid #ffd54a}
#topics label{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer}
#topics input{width:18px;height:18px;accent-color:var(--green)}
#msg{font-size:.82rem;color:var(--muted);margin:8px 0 0}

/* search + chips */
#q{width:100%;margin:14px 0 10px;padding:11px 14px;font:inherit;border:1px solid var(--line);border-radius:8px;background:#fff}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:.9rem;padding:6px 14px;border-radius:20px;cursor:pointer}
.chip.active{background:var(--green);border-color:var(--green);color:#fff}

/* news cards */
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:6px;padding:12px 14px;margin-top:10px}
.meta{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.src{background:var(--green-soft);color:var(--green);font-weight:600;padding:1px 8px;border-radius:4px}
.tag{border:1px solid var(--line);padding:0 8px;border-radius:4px}
.card h2{font-size:1.02rem;line-height:1.3;margin:6px 0}
.card p{margin:0 0 8px;font-size:.92rem;color:#33423a}
.card a{color:var(--green);font-weight:600;font-size:.9rem}
.state{text-align:center;color:var(--muted);padding:30px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo"><span>newsalat</span></div>
    <button id="bell" aria-label="Notification settings" aria-expanded="false">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
  </div>
  <div id="panel" role="dialog" aria-label="Notification settings">
    <div class="row"><span>Notifications</span>
      <label class="switch"><input type="checkbox" id="notifSwitch" aria-label="Notifications on or off"><i></i></label>
    </div>
    <div id="topics"></div>
    <p id="msg"></p>
  </div>
</header>

<main class="wrap">
  <input id="q" type="search" placeholder="Search news, e.g. protest in CBD" aria-label="Search news">
  <div id="chips"></div>
  <div id="feed"><div class="state">Loading news...</div></div>
</main>

<script>
/* ---------- settings: change things here ---------- */
const API = '/api/api.php';
const VAPID_PUBLIC_KEY = 'BMsbTYvOFBsPKK9k5xKz8dyJ2IDDUVFWI2z3S1BK1-fKsA_qZbLITw_CL2ON6AojvW5SV28WLcm7SbGYEaVU2lg';
const REFRESH_MS = 2 * 60 * 1000;
const TOPICS = [                       // add a topic = add one line (also add it in core.php)
  {id: 'finance',     label: 'Finance Bill'},
  {id: 'protest',     label: 'Protest'},
  {id: 'agriculture', label: 'Agriculture'},
  {id: 'politics',    label: 'Politics'}
];

/* ---------- state ---------- */
let activeTopic = '';
let searchText = '';
let timer;
const $ = id => document.getElementById(id);
const saved = JSON.parse(localStorage.getItem('newsalat') || '{}');
let chosen = saved.topics || ['finance', 'protest'];
let notifOn = !!saved.on;
const store = () => localStorage.setItem('newsalat', JSON.stringify({topics: chosen, on: notifOn}));

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = id => (TOPICS.find(t => t.id === id) || {label: id === 'general' ? 'General' : id}).label;

function timeAgo(dateStr) {
  const s = Math.max(0, (Date.now() - new Date(dateStr.replace(' ', 'T')).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

/* ---------- feed ---------- */
function card(a) {
  return `<article class="card">
    <div class="meta"><span class="src">${esc(a.source)}</span><span>${timeAgo(a.published_at)}</span><span class="tag">${esc(label(a.topic))}</span></div>
    <h2>${esc(a.title)}</h2>
    <p>${esc(a.summary)}</p>
    <a href="${esc(a.link)}" target="_blank" rel="noopener">Read full story</a>
  </article>`;
}

async function loadFeed() {
  const url = `${API}?action=articles&topic=${encodeURIComponent(activeTopic)}&q=${encodeURIComponent(searchText)}`;
  try {
    const res = await fetch(url);
    const list = await res.json();
    $('feed').innerHTML = list.length ? list.map(card).join('')
      : '<div class="state">No news found. Try another word or topic.</div>';
  } catch (e) {
    $('feed').innerHTML = '<div class="state">Could not load news. Check your connection and try again.</div>';
  }
}

function drawChips() {
  const all = [{id: '', label: 'All'}, ...TOPICS];
  $('chips').innerHTML = all.map(t =>
    `<button class="chip${t.id === activeTopic ? ' active' : ''}" data-t="${t.id}">${t.label}</button>`).join('');
}

$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  activeTopic = b.dataset.t; drawChips(); loadFeed();
});

$('q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => { searchText = e.target.value.trim(); loadFeed(); }, 400);
});

/* ---------- bell panel ---------- */
function drawTopics() {
  $('topics').innerHTML = [{id: 'all', label: 'All news'}, ...TOPICS].map(t =>
    `<label><input type="checkbox" value="${t.id}" ${chosen.includes(t.id) ? 'checked' : ''}> ${t.label}</label>`).join('');
  $('notifSwitch').checked = notifOn;
  $('bell').classList.toggle('on', notifOn);
}

$('bell').addEventListener('click', e => {
  e.stopPropagation();
  const open = $('panel').classList.toggle('open');
  $('bell').setAttribute('aria-expanded', open);
});
$('panel').addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => { $('panel').classList.remove('open'); $('bell').setAttribute('aria-expanded', false); });

function say(t) { $('msg').textContent = t; }

function keyToBytes(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

async function post(action, body) {
  const res = await fetch(`${API}?action=${action}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('Server error');
}

async function turnOn() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    say('This browser does not support notifications.'); return false;
  }
  if (await Notification.requestPermission() !== 'granted') {
    say('Notifications are blocked. Allow them in your browser settings.'); return false;
  }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true, applicationServerKey: keyToBytes(VAPID_PUBLIC_KEY)
  });
  await post('subscribe', {subscription: sub.toJSON(), topics: chosen});
  say('Notifications are on.');
  return true;
}

async function turnOff() {
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub) { await post('unsubscribe', {endpoint: sub.endpoint}); await sub.unsubscribe(); }
  say('Notifications are off.');
}

$('notifSwitch').addEventListener('change', async e => {
  try {
    if (e.target.checked) { notifOn = await turnOn(); } else { await turnOff(); notifOn = false; }
  } catch (err) {
    notifOn = false; say('Something went wrong. Try again.');
  }
  store(); drawTopics();
});

$('topics').addEventListener('change', async () => {
  chosen = [...document.querySelectorAll('#topics input:checked')].map(i => i.value);
  store();
  if (notifOn) {
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) { await post('subscribe', {subscription: sub.toJSON(), topics: chosen}); say('Topics saved.'); }
    } catch (err) { say('Could not save topics. Try again.'); }
  }
});

/* ---------- start ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
drawChips(); drawTopics(); loadFeed();
const refresh = () => fetch(`${API}?action=cron`).then(r => r.json()).then(d => { if (d.new > 0) loadFeed(); }).catch(() => {});
refresh();
setInterval(() => { refresh(); loadFeed(); }, REFRESH_MS);
</script>
</body>
</html>
